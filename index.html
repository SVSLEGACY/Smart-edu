    <script>
      (function() {
        try {
          var t = localStorage.getItem('learnify-theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-[#F8F9FA] dark:bg-[#121214] text-zinc-900 dark:text-zinc-100 antialiased selection:bg-orange-500 selection:text-white transition-colors duration-200">
